<script type="module">
// The Roadster from four sides, thrusters firing: /tools/roadster-preview.html?fire=1
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildRoadster } from '/roadster.js';
const q = new URLSearchParams(location.search), fire = q.get('fire') === '1';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment()).texture;

const car = buildRoadster();
scene.add(car.group);
car.shadow.layers.set(1);
car.roadster.setDriver(true);
for (let i = 0; i < 60; i++) car.roadster.update(1 / 30, fire ? { boost: 1, fan: 1, lift: 1, side: 0.6, wing: 1 } : { wing: q.get('wing') ? +q.get('wing') : 0 });
const views = (q.get('views') || '6,2.2,6;0,1.4,-7;7,1.2,0;0,1.6,8').split(';').map((v) => v.split(',').map(Number));
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);

  camera.aspect = w / h; camera.updateProjectionMatrix();

  renderer.render(scene, camera);
});
document.title = 'ready';
</script></body></html>
