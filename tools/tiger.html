<!doctype html>
<!-- Tiger statue preview, from the same angle as the reference photo. -->
<html><body style="margin:0">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { tigerStatue } from '../tiger.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9ccd0);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(3, 8, 6);
sun.castShadow = true;
scene.add(sun, new THREE.HemisphereLight(0xffffff, 0x777066, 0.7));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0xb8b2a8 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground, tigerStatue());
const person = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.3, 4, 8), new THREE.MeshStandardMaterial({ color: 0x334455 }));
person.position.set(3.5, 0.87, -3);
scene.add(person);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-1.6, 1.3, 4.2);
camera.lookAt(0.3, 0.9, 0);
renderer.render(scene, camera);
requestAnimationFrame(() => { renderer.render(scene, camera); document.title = 'ready'; });
</script></body></html>
