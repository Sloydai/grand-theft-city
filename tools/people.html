<!doctype html>
<!-- People line-up for checking proportions, with a 1.75 m reference bar. -->
<html><body style="margin:0">
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildPerson, posePerson } from '../person.js';
import { busShelter, postbox, streetBin } from '../street.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9b8c6);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 10, 8);
sun.castShadow = true;
scene.add(sun, new THREE.HemisphereLight(0xdfe8f0, 0x5a5348, 0.8));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x8a8a88 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const walk = new URLSearchParams(location.search).has('walk');
for (let i = 0; i < 8; i++) {
  const p = buildPerson({}, 1000 + i * 7919);
  p.mesh.position.set(i * 0.75 - 3.4, 0, 0);
  if (walk) posePerson(p, i * 0.8, 0.6, false, 0);
  scene.add(p.mesh);
}
const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.75, 0.05), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
bar.position.set(-4.1, 0.875, 0);
scene.add(bar);
const add = (baked, x, z, r = 0) => { const g = new THREE.Group(); for (const p of baked.parts) g.add(new THREE.Mesh(p.geometry, p.material)); g.position.set(x, 0, z); g.rotation.y = r; scene.add(g); };
add(busShelter(), 1, -3.5);
add(postbox(), -2, -1.6);
add(streetBin(), -1.2, -1.6);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
const close = new URLSearchParams(location.search).has('close');
camera.position.set(close ? -2.3 : 0, close ? 1.65 : 2, close ? 1.3 : 7.5);
camera.lookAt(close ? -2.3 : 0, close ? 1.5 : 1, close ? 0 : -1);
renderer.render(scene, camera);
requestAnimationFrame(() => { renderer.render(scene, camera); document.title = 'ready'; });
</script></body></html>
